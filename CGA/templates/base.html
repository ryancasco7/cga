<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="My Image" style="width: 40px; height: auto; margin: 5px" >
            <a class="navbar-brand" href="/">Career Detection System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/careers">Careers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/tracks">Tracks/Strands</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/opportunity">Get Your Career Guidance Now !</a>
                    </li>
               
                    <li class="nav-item">
                        <a class="nav-link" href="/graphs">View Skills Pie Chart</a>
                    </li> 
                  
                        <li class="nav-item">
                            <a class="nav-link" href="/history_log">History log</a>
                        </li>
                   
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <footer class="bg-primary text-white text-center py-3 mt-5">
        <p>&copy; 2025 Career Detection System. All Rights Reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
