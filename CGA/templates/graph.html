<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytic Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .chart-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        canvas {
            width: 400px;
            height: 300px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="My Image" style="width: 40px; height: auto; margin: 5px" >
            <a class="navbar-brand" href="/">Career Detection System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/careers">Careers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/tracks">Tracks/Strands</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/opportunity">Get Your Career Guidance Now !</a>
                    </li>
            
                    <li class="nav-item">
                        <a class="nav-link" href="/graphs">View Dashboard</a>
                    </li> 
                
                        <li class="nav-item">
                            <a class="nav-link" href="/history_log">History log</a>
                        </li>
                
                </ul>
            </div>
        </div>
    </nav>


    <h1>📊 Analytic Dashboard</h1>

    <div class="chart-container">
        <div>
            <h3>Age Distribution</h3>
            <canvas id="ageChart"></canvas>
        </div>
        <div>
            <h3>Gender Distribution</h3>
            <canvas id="genderChart"></canvas>
        </div>
        <div>
            <h3>School Distribution</h3>
            <canvas id="schoolChart"></canvas>
        </div>
        <div>
            <h3>Cluster Scores</h3>
            <canvas id="clusterChart"></canvas>
        </div>
        <div>
            <h3>Grade Distribution</h3>
            <canvas id="gradeChart"></canvas>
        </div>
        
    </div>

    <script src="{{ url_for('static', filename='graph.js') }}"></script>
</body>
</html>
